<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration</h1>

    <form>
        <label for="fname">First Name:</label>
        <br>
        <input type="text" id="fname" name="fname" required>
        <br>
        <label for="lname">Last Name:</label>
        <br>
        <input type="text" id="lname" name="lname" required>
        <br>
        <label for="email">Email:</label>
        <br>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="password">Password:</label>
        <br>
        <input type="password" id="password" name="password" required>
        <br>
        <label for="confirm password">Confirm Password</label>
        <br>
        <input type="password" id="confirm password" name="confirm password" required>
        <br>
        <label for="phone">Phone Number:</label>
        <br>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
        <br>
        <label for="dob">Date of Birth:</label>
        <br>
        <input type="date" id="dob" name="dob" required>
        <br>
        <label for="gender">Gender:</label>
        <br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Other</label>
        <br>
        <label for="department">Department:</label>
        <br>
        <select name="department" id="department" required>
            <option value="select">Select a department</option>
            <option value="cse">CSE</option>
            <option value="eee">EEE</option>
            <option value="bba">BBA</option>
            <option value="english">English</option>
        </select>
        <br>
        <label for="skills">Skills:</label>
        <br>
        <input type="checkbox" id="skills" name="skills" value="HTML">
        <label for="skills">HTML</label>
        <input type="checkbox" id="skills" name="skills" value="CSS">
        <label for="skills">CSS</label>
        <input type="checkbox" id="skills" name="skills" value="JavaScript">
        <label for="skills">JavaScript</label>
        <input type="checkbox" id="skills" name="skills" value="React">
        <label for="skills">React</label>
        <br>
        <label for="address">Address:</label>
        <br>
        <textarea name="address" id="address" cols="30" rows="10" placeholder="Enter your address"></textarea>
        <br>

        <label for="file">Upload your profile picture:</label>
        <br>
        <input type="file" id="file" name="file" accept=".jpg, .jpeg, .png" required>
        <br>
    
        <button type="submit">Submit</button>
    </form>
</body>
</html>
